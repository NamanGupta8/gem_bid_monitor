<div class="min-h-screen bg-slate-50">
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
      <div>
        <h1 class="text-lg font-semibold text-slate-900">GeM Bid Monitor</h1>
        <p class="text-sm text-slate-500">
          @if (lastChecked()) {
            Last checked {{ lastChecked() | date:'short' }}
          } @else {
            Not checked yet
          }
        </p>
      </div>
      <button
        (click)="runCheckNow()"
        [disabled]="checking()"
        class="inline-flex cursor-pointer items-center gap-2 rounded-md bg-accent-600 px-4 py-2 text-sm font-medium text-white hover:bg-accent-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        @if (checking()) {
          Checking… (can take a few minutes)
        } @else {
          Check now
        }
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-7xl px-6 py-6">
    @if (error()) {
      <div class="mb-4 rounded-md border border-warn-600/30 bg-warn-100 px-4 py-3 text-sm text-warn-700">
        {{ error() }}
      </div>
    }

    <app-filter-bar
      [ministries]="ministries()"
      [keywords]="keywords()"
      (filtersChanged)="onFiltersChanged($event)"
    />

    @if (loading()) {
      <p class="mt-6 text-sm text-slate-500">Loading matches…</p>
    } @else {
      <app-bid-table [bids]="filteredMatches()" class="mt-4 block" />
    }
  </main>
</div>
